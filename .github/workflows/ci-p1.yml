name: AgentOS P1 — Process + IPC
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y gcc make python3 pkg-config libjson-c-dev libcurl4-openssl-dev
      - run: make doctor && make
  pcb:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y gcc make python3 pkg-config libjson-c-dev libcurl4-openssl-dev
      - run: python3 tests/test_process_manager_unit.py
  all-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y gcc make python3 pkg-config libjson-c-dev libcurl4-openssl-dev
      - run: make && make test
